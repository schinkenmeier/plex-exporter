name: Build and Publish Docker Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ backend, frontend ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/plex-exporter-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Backend smoke test
        if: matrix.service == 'backend'
        run: |
          docker build --target production --load -t plex-exporter-backend:smoke -f apps/backend/Dockerfile .
          docker run --rm --entrypoint node plex-exporter-backend:smoke -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.close();"
          docker run -d --name plex-exporter-backend-smoke -e NODE_ENV=production -e SQLITE_PATH=/app/data/sqlite/smoke.sqlite plex-exporter-backend:smoke
          for i in $(seq 1 30); do
            if docker exec plex-exporter-backend-smoke node -e "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"; then
              docker rm -f plex-exporter-backend-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs plex-exporter-backend-smoke
          docker rm -f plex-exporter-backend-smoke
          exit 1

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
