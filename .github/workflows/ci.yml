name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CI: true
  EXPECTED_NPM_VERSION: 11.14.1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'config/**'
              - '.github/workflows/**'
              - 'tools/lint.mjs'
              - '.nvmrc'
              - '.npmrc'
              - 'package-lock.json'
              - 'package.json'
              - 'tsconfig.base.json'
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'config/**'
              - '.github/workflows/**'
              - 'tools/lint.mjs'
              - '.nvmrc'
              - '.npmrc'
              - 'package-lock.json'
              - 'package.json'
              - 'tsconfig.base.json'
            docker:
              - '.dockerignore'
              - '.github/workflows/**'
              - '.npmrc'
              - '.nvmrc'
              - 'package-lock.json'
              - 'package.json'
              - 'apps/backend/Dockerfile'
              - 'apps/frontend/Dockerfile'
              - 'docker-compose.yml'
              - 'deploy/**'
              - 'tools/tautulli-mock/**'
              - 'Caddyfile'
            docs:
              - '.github/workflows/**'
              - '.nvmrc'
              - '.npmrc'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - 'docs/**'
              - 'work/**'
              - 'apps/**/README.md'
              - 'apps/**/SECURITY.md'
              - 'tools/**/README.md'
              - 'tools/check-doc-links.mjs'
              - 'tools/check-german-transliterations.mjs'
              - 'tools/lint.mjs'
              - 'package.json'
              - 'tools/package.json'

  quality:
    name: Repository • lint gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use expected npm version
        run: |
          npm install -g npm@${EXPECTED_NPM_VERSION}
          test "$(npm --version)" = "${EXPECTED_NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Run repository lint gate
        run: npm run lint

  docs:
    name: Docs • link validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use expected npm version
        run: |
          npm install -g npm@${EXPECTED_NPM_VERSION}
          test "$(npm --version)" = "${EXPECTED_NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Validate markdown links
        run: npm run docs:check

      - name: Validate German text consistency
        run: npm run text:check

  frontend:
    name: Frontend • test & build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use expected npm version
        run: |
          npm install -g npm@${EXPECTED_NPM_VERSION}
          test "$(npm --version)" = "${EXPECTED_NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test --workspace @plex-exporter/frontend

      - name: Type-check frontend
        run: npm run type-check --workspace @plex-exporter/frontend

      - name: Build production bundle
        run: npm run build --workspace @plex-exporter/frontend

      - name: Upload dist artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/public/dist
          retention-days: 5

  backend:
    name: Backend • test & build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use expected npm version
        run: |
          npm install -g npm@${EXPECTED_NPM_VERSION}
          test "$(npm --version)" = "${EXPECTED_NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Build admin UI bundle
        run: npm run build --workspace @plex-exporter/frontend

      - name: Run tests
        run: npm test --workspace @plex-exporter/backend

      - name: Type-check backend
        run: npm run type-check --workspace @plex-exporter/backend

      - name: Build backend
        run: npm run build --workspace @plex-exporter/backend

  docker:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Show Docker version
        run: docker version

      - name: Validate docker-compose config
        run: docker compose --profile tautulli config

      - name: Build backend & frontend images
        run: docker compose build backend caddy

      - name: Smoke test backend image
        run: |
          docker build --target production --load -t plex-exporter-backend:smoke -f apps/backend/Dockerfile .
          docker run --rm --entrypoint node plex-exporter-backend:smoke -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.close();"
          docker run -d --name plex-exporter-backend-smoke -e NODE_ENV=production -e SQLITE_PATH=/app/data/sqlite/smoke.sqlite plex-exporter-backend:smoke
          for i in $(seq 1 30); do
            if docker exec plex-exporter-backend-smoke node -e "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"; then
              docker rm -f plex-exporter-backend-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs plex-exporter-backend-smoke
          docker rm -f plex-exporter-backend-smoke
          exit 1

      - name: Build tautulli mock image
        run: docker compose --profile tautulli build tautulli-mock
